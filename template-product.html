<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>トマト ｜ ○○農業高校 直売所</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- ヘッダー -->
  <header class="header">
    <h1>🌱 ○○農業高校 直売所</h1>
    <p>生徒たちが心をこめて育てた野菜を紹介しています</p>
  </header>

  <!-- 戻るボタン -->
  <nav class="back-area">
    <a href="index.html" class="back-button">
      ← 商品一覧へ戻る
    </a>
  </nav>

  <!-- メイン -->
  <main class="product-page">

    <!-- 商品カード -->
    <section class="product-card">

      <!-- 写真 -->
      <div class="image-area">
        <img src="images/tomato.jpg" alt="トマトの写真">
      </div>

      <!-- 商品情報 -->
      <div class="info-area">

        <p class="catch-copy">
          甘くてジューシー！
        </p>

        <h2>トマト</h2>

        <p class="description">
          甘みと酸味のバランスが良いトマトです。
          水や温度の管理に気をつけながら、
          毎日大切に育てました。
        </p>

        <!-- 詳細情報 -->
        <div class="detail-box">

          <h3>👤 だれにおすすめ？</h3>
          <p>
            野菜が好きな人はもちろん、
            トマトが少し苦手な人にもおすすめです。
          </p>

          <h3>🍴 おすすめの食べ方</h3>
          <p>
            冷やしてサラダにすると、
            みずみずしさがより感じられます。
          </p>

          <h3>💬 育てた人から一言</h3>
          <p>
            暑い日の作業は大変でしたが、
            収穫できた時はとてもうれしかったです。
          </p>

        </div>

      </div>

    </section>

  </main>

  <!-- フッター -->
  <footer class="footer">
    <p>
      © 2026 ○○農業高校<br>
      農業情報活用の授業で制作しました
    </p>
  </footer>

</body>
</html>
